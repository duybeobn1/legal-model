[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-legal-ai"
version = "0.1.0"
description = "Offline document ingestion foundation for the Local Legal AI project"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]
